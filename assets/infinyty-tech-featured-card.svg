<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Gradient Background matching website dark theme -->
  <rect width="1200" height="630" fill="#020714"/>
  
  <!-- Subtle glowing background shapes -->
  <circle cx="600" cy="315" r="400" fill="url(#bgGlow)" opacity="0.4" filter="blur(60px)"/>
  
  <!-- Content Group (Centered) -->
  <g transform="translate(600, 315)">
    <!-- Scale and Center the Wave Icon above the text -->
    <g transform="translate(-100, -180) scale(5)">
      <path d="M10 18C10 12 15 11 18 15.5C21 20 26 25 30 20C34 15 29 10 25 14.5C21 19 16 25 12 21C9.5 18.5 9.5 12.5 15 11" 
            stroke="url(#logoGrad)" 
            stroke-width="2.6" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
    
    <!-- Title Text -->
    <text x="0" y="70" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="64" fill="#f8fafc" letter-spacing="-0.02em">
      <tspan font-weight="400">infi</tspan><tspan font-weight="700" fill="#4FC8FF">nyty</tspan><tspan font-weight="400" fill="#94a3b8">.tech</tspan>
    </text>
    
    <!-- Subtitle Text -->
    <text x="0" y="140" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="500" fill="#64748b" letter-spacing="0.05em">
      CUSTOM SOFTWARE &amp; ENTERPRISE AI
    </text>
  </g>

  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0072F4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020714" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Line Gradient -->
    <linearGradient id="logoGrad" x1="10" y1="18" x2="34" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0072F4"/>
      <stop offset="100%" stop-color="#4FC8FF"/>
    </linearGradient>

    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;family=Inter:wght@500&amp;display=swap');
    </style>
  </defs>
</svg>
