<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Infinyty Driver &amp; Operator Portal</title>
    <link rel="icon" type="image/png" href="/assets/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/demos/fleet-portal/assets/index-C-STICVX.js"></script>
    <link rel="stylesheet" crossorigin href="/demos/fleet-portal/assets/index-Dvvyns55.css">
    <style>
      *, *::before, *::after {
        box-sizing: border-box !important;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #f0f4f8;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f0f4f8;
      }

      /* Desktop view (>= 480px): Large phone screen with PURE WHITE border & zero corner artifacts */
      @media (min-width: 480px) {
        body {
          background: #f0f4f8;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #root {
          padding: 24px 16px !important;
          min-height: 100vh !important;
          width: 100% !important;
          display: flex !important;
          justify-content: center !important;
          align-items: center !important;
          background: transparent !important;
        }
        #root > div {
          min-height: unset !important;
          height: auto !important;
          display: flex !important;
          justify-content: center !important;
          align-items: center !important;
          background: transparent !important;
          padding: 0 !important;
          border: none !important;
          box-shadow: none !important;
        }
        #root > div > div {
          width: 440px !important;
          max-width: 440px !important;
          min-width: 440px !important;
          height: 920px !important;
          min-height: 920px !important;
          max-height: min(920px, calc(100vh - 40px)) !important;
          border-radius: 54px !important;
          border: 10px solid #ffffff !important;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04) !important;
          overflow: hidden !important;
          position: relative !important;
          display: flex !important;
          flex-direction: column !important;
          background: #ffffff !important;
          /* Bulletproof clip fix for Chromium GPU corner bleed */
          -webkit-mask-image: -webkit-radial-gradient(white, black) !important;
          mask-image: radial-gradient(white, black) !important;
          isolation: isolate !important;
          transform: translateZ(0) !important;
        }
      }

      /* Mobile view (< 480px): Natural full-screen mobile app */
      @media (max-width: 479px) {
        html, body, #root, #root > div, #root > div > div {
          width: 100% !important;
          max-width: 100% !important;
          min-height: 100vh !important;
          height: 100% !important;
          border-radius: 0 !important;
          border: none !important;
          box-shadow: none !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0;">
    <div id="root"></div>
  </body>
</html>
