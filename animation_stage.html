<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 400px;
      height: 400px;
    }
    
    .logo-container {
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    .drawing-path {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      /* 3 second animation loop, linear, infinite */
      animation: draw 3s linear infinite;
    }

    .drawing-path-glow {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: drawGlow 3s linear infinite;
    }

    @keyframes draw {
      0% {
        stroke-dashoffset: 200;
        opacity: 0;
      }
      5% {
        opacity: 1;
      }
      75% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      90%, 100% {
        stroke-dashoffset: 0;
        opacity: 0;
      }
    }

    @keyframes drawGlow {
      0% {
        stroke-dashoffset: 200;
        opacity: 0;
      }
      5% {
        opacity: 0;
      }
      15% {
        stroke-dashoffset: 200;
        opacity: 0.35;
      }
      75% {
        stroke-dashoffset: 0;
        opacity: 0.35;
      }
      90%, 100% {
        stroke-dashoffset: 0;
        opacity: 0;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="logo-container">
    <svg viewBox="0 0 40 36" fill="none">
      <!-- Glow Path -->
      <path class="drawing-path-glow" d="M10 18C10 12 15 11 18 15.5C21 20 26 25 30 20C34 15 29 10 25 14.5C21 19 16 25 12 21C9.5 18.5 9.5 12.5 15 11" 
            stroke="#0072F4" 
            stroke-width="5" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            style="filter: blur(2px);"/>
      
      <!-- Solid Front Path -->
      <path class="drawing-path" d="M10 18C10 12 15 11 18 15.5C21 20 26 25 30 20C34 15 29 10 25 14.5C21 19 16 25 12 21C9.5 18.5 9.5 12.5 15 11" 
            stroke="url(#animLogoGrad)" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      
      <defs>
        <linearGradient id="animLogoGrad" x1="10" y1="18" x2="34" y2="18" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#0072F4"/>
          <stop offset="100%" stop-color="#4FC8FF"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
</body>
</html>
